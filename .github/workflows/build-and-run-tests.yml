name: Build and run simple ksmt tests

on:
  push:
    branches:
      - main

  pull_request:
    types: [ opened, edited ]
    branches:
      - main

jobs:
  run_tests:
    name: Run tests
    strategy:
      # Without this a failure on one platform cancels the others, and the
      # cancellation is what gets reported, hiding the actual failure.
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and run tests
        run: ./gradlew build --no-daemon --continue -PrunBenchmarksBasedTests=false

      - name: Upload ksmt test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ksmt-tests-report-${{ matrix.os }}
          path: ./**/build/reports/tests/test/
